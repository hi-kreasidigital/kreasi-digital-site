name: Rebuild site from Airtable

on:
  schedule:
    - cron: "*/15 * * * *"   # cek Airtable tiap 15 menit
  workflow_dispatch: {}       # tombol "Run workflow" manual di tab Actions
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: rebuild-site
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate pages from Airtable
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          BASE_PATH: ${{ secrets.BASE_PATH }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REPO_ROOT: ${{ github.workspace }}
        run: python scripts/generate_from_airtable.py

      - name: Commit & push if there are changes
        run: |
          git config user.name "kreasi-digital-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-publish dari Airtable [skip ci]"
          git push
